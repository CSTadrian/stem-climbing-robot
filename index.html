<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Robot Gesture Arena - Arcade Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-blue: #00f0ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --bg-dark: #0a0b16;
            --card-bg: rgba(22, 26, 51, 0.9);
            --border-dim: #262c54;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% 20%, #171b38 0%, var(--bg-dark) 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        .arena-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 學生基本資訊膠囊條 */
        .meta-strip {
            display: grid;
            grid-template-columns: 140px 140px 1.5fr auto;
            gap: 10px;
            background: rgba(14, 17, 36, 0.8);
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-dim);
            align-items: center;
        }
        .meta-strip input, .meta-strip select {
            background: #060812;
            border: 1px solid #333c6d;
            color: #fff;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        /* ================= 核心：1-2-3 步驟結構看板 ================= */
        .stepper-board {
            display: grid;
            grid-template-columns: 1fr 1.3fr 1fr;
            gap: 14px;
        }
        .step-card {
            background: var(--card-bg);
            border: 2px solid var(--border-dim);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: all 0.3s ease;
        }
        /* 步驟狀態樣式 */
        .step-card.done {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }
        .step-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .step-title {
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .step-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            background: #111428;
            color: #8892b0;
            border: 1px solid #333d6b;
            font-weight: bold;
        }
        .step-card.done .step-tag {
            background: rgba(0, 255, 102, 0.15);
            color: var(--neon-green);
            border-color: var(--neon-green);
        }
        .step-btn {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: #fff;
            border: 1px solid #475569;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .step-btn:hover { filter: brightness(1.15); }
        .step-btn.ready-btn {
            background: linear-gradient(135deg, #059669, #10b981);
            border-color: var(--neon-green);
        }

        /* 步驟 3 大按鈕 (就緒前灰色鎖定，就緒後超亮脈衝) */
        .btn-launch {
            background: #1a2035;
            color: #64748b;
            border: 2px dashed #334155;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 900;
            cursor: not-allowed;
            letter-spacing: 1px;
            width: 100%;
            height: 100%;
            min-height: 48px;
        }
        .btn-launch.unlocked {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-green));
            color: #032117;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            animation: pulse-launch 1.4s infinite alternate;
        }
        @keyframes pulse-launch {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
            100% { transform: scale(1.02); box-shadow: 0 0 25px rgba(0, 255, 102, 0.8); }
        }

        /* ================= 遊戲擂台與軌道 ================= */
        .stage-layout {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 16px;
        }
        .arena-box {
            background: var(--card-bg);
            border: 2px solid var(--border-dim);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .combo-badge {
            font-size: 26px;
            color: var(--neon-yellow);
            font-weight: 900;
            text-shadow: 0 0 12px rgba(255, 230, 0, 0.7);
            transition: transform 0.1s;
        }
        .combo-badge.pop { transform: scale(1.3) rotate(-3deg); }
        .score-pill {
            background: linear-gradient(90deg, #ff007f, #7928ca);
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 900;
        }

        /* 動作流動軌道 (Rhythm Ribbon) */
        .ribbon-track-wrapper {
            background: #080914;
            border: 2px solid #202747;
            border-radius: 14px;
            padding: 14px;
            position: relative;
            overflow: hidden;
        }
        .ribbon-track {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .action-card {
            background: #141730;
            border: 2px solid #2c355e;
            border-radius: 12px;
            min-width: 100px;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .action-card .symbol { font-size: 44px; line-height: 1; margin-bottom: 4px; }
        .action-card .c-name { font-size: 15px; font-weight: 800; }
        .action-card .sub-num {
            font-size: 10px;
            font-weight: bold;
            color: #8892b0;
            background: rgba(255,255,255,0.08);
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
        }
        /* 當前需要匹配的 HIT ZONE */
        .action-card.active-target {
            min-width: 130px;
            height: 160px;
            background: linear-gradient(180deg, #2c164a 0%, #151a3c 100%);
            border: 3px solid var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            transform: scale(1.05);
            z-index: 2;
        }
        .action-card.active-target .symbol { font-size: 58px; }
        .action-card.active-target::before {
            content: "⚡ HIT NOW";
            position: absolute;
            top: -12px;
            background: var(--neon-pink);
            color: #fff;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .action-card.upcoming { opacity: 0.6; transform: scale(0.92); }

        /* 計時倒數條 */
        .timer-bg {
            height: 7px;
            background: #181d38;
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }
        .timer-fill {
            height: 100%;
            width: 100%;
            background: var(--neon-blue);
            transition: width 0.05s linear;
        }

        /* 視訊預覽與信心度 */
        .arena-footer {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 14px;
            align-items: center;
        }
        #webcam-container {
            width: 220px;
            height: 150px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #2e366b;
        }
        .meters-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .meter-row {
            background: #0e1124;
            border: 1px solid #232a50;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
        .meter-row.matched {
            background: rgba(0, 255, 102, 0.15);
            border-color: var(--neon-green);
            color: var(--neon-green);
            font-weight: bold;
        }

        /* 攀爬高度塔 */
        .tower-card {
            background: var(--card-bg);
            border: 2px solid var(--border-dim);
            border-radius: 16px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .rope-shaft {
            flex-grow: 1;
            width: 6px;
            background: #2b335c;
            border-radius: 3px;
            margin: 10px 0;
            position: relative;
            min-height: 250px;
        }
        .robot-indicator {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 0%;
            font-size: 34px;
            transition: bottom 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 0 6px #00f0ff);
        }

        /* 命中動畫 */
        #splash-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        #splash-text.show { transform: translate(-50%, -50%) scale(1.15); }
    </style>
</head>
<body>

<div class="arena-container">
    <!-- 學生分組資料列 -->
    <div class="meta-strip">
        <input type="text" id="groupId" placeholder="組別 (例: Group-01)">
        <input type="text" id="studentId" placeholder="學號 (例: S01)">
        <select id="conditionType">
            <option value="XAI_GradCAM">實驗組 (Grad-CAM 熱力圖)</option>
            <option value="No_XAI_Blackbox">對照組 (黑盒無解釋)</option>
        </select>
        <button onclick="uploadDataToDrive()" style="background:#1e293b; color:#94a3b8; border:1px solid #334155; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:12px;">
            📤 提交成績到 Drive
        </button>
    </div>

    <!-- ================= 核心 1-2-3 任務看板 ================= -->
    <div class="stepper-board">
        <!-- 步驟 1: 硬件串口連接 -->
        <div class="step-card" id="card-step1">
            <div>
                <div class="step-header">
                    <span class="step-title">🔌 步驟 1：連接硬件</span>
                    <span class="step-tag" id="tag-step1">未連接 ⚪</span>
                </div>
                <div style="font-size: 11px; color: #8892b0; margin-bottom: 10px;">
                    將發射端 micro:bit 直插電腦 USB
                </div>
            </div>
            <button class="step-btn" id="btn-step1" onclick="connectSerial()">
                連接 Tx micro:bit
            </button>
        </div>

        <!-- 步驟 2: AI 模型與視訊鏡頭 -->
        <div class="step-card" id="card-step2">
            <div>
                <div class="step-header">
                    <span class="step-title">📷 步驟 2：載入模型</span>
                    <span class="step-tag" id="tag-step2">未載入 ⚪</span>
                </div>
                <input type="text" id="modelUrl" placeholder="貼上 Teachable Machine 模型連結" style="background:#090b16; border:1px solid #333d6b; color:#fff; width:100%; padding:6px; font-size:11px; border-radius:4px; margin-bottom: 8px;">
            </div>
            <button class="step-btn" id="btn-step2" onclick="initAI()">
                啟動模型與鏡頭
            </button>
        </div>

        <!-- 步驟 3: 啟動對戰競技 -->
        <div class="step-card" id="card-step3">
            <div>
                <div class="step-header">
                    <span class="step-title">🚀 步驟 3：開始競技</span>
                    <span class="step-tag" id="tag-step3">待解鎖 🔒</span>
                </div>
                <div style="font-size: 11px; color: #8892b0; margin-bottom: 10px;" id="desc-step3">
                    需先完成步驟 1 及 步驟 2
                </div>
            </div>
            <button class="btn-launch" id="btn-launch" onclick="startGame()" disabled>
                等待準備...
            </button>
        </div>
    </div>

    <!-- 主遊戲擂台 -->
    <div class="stage-layout">
        <div class="arena-box">
            <div class="hud-bar">
                <div class="combo-badge" id="combo-display">0x COMBO</div>
                <div class="score-pill">攀爬得分：<span id="score-counter">0</span></div>
            </div>

            <!-- 動作預告流動軌道 -->
            <div class="ribbon-track-wrapper">
                <div class="ribbon-track" id="queue-ribbon">
                    <!-- 動態生成 1 個 Active + 4 個 Upcoming -->
                </div>
                <div class="timer-bg">
                    <div class="timer-fill" id="timer-bar"></div>
                </div>
                <div id="splash-text">PERFECT!</div>
            </div>

            <!-- 鏡頭與類別判定比率 -->
            <div class="arena-footer">
                <div id="webcam-container"></div>
                <div class="meters-grid" id="meters-container"></div>
            </div>
        </div>

        <!-- 右側攀爬高度塔 -->
        <div class="tower-card">
            <div style="font-size: 26px;">🏆</div>
            <div style="font-size: 10px; color: #8892b0; font-weight: bold;">FINISH</div>
            <div class="rope-shaft" id="rope-shaft">
                <div class="robot-indicator" id="robot-indicator">🤖</div>
            </div>
            <div style="font-size: 10px; color: #8892b0; font-weight: bold;">START</div>
            <div style="font-size: 20px;">🚩</div>
        </div>
    </div>
</div>

<script>
    // 固定的 5 類定義
    const GESTURES = {
        "Class 1": { name: "石頭", symbol: "✊", num: "No. 1" },
        "Class 2": { name: "剪刀", symbol: "✌️", num: "No. 2" },
        "Class 3": { name: "布",   symbol: "🖐️", num: "No. 3" },
        "Class 4": { name: "讚好", symbol: "👍", num: "No. 4" },
        "Class 5": { name: "待機", symbol: "🫱", num: "No. 5" }
    };
    const ACTIVE_TARGETS = ["Class 1", "Class 2", "Class 3", "Class 4"];
    const DRIVE_FOLDER_ID = "18VTaAPt86z7u4BCevGm96ZDF6uRdoODu";
    const GAS_ENDPOINT = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    // 步驟完成狀態旗標
    let step1Ready = false;
    let step2Ready = false;

    // Web Audio 合成音效
    let audioCtx = null;
    function playSfx(type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === "hit") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(587, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === "combo") {
                osc.type = "triangle";
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(659, now + 0.08);
                osc.frequency.setValueAtTime(784, now + 0.16);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc.start(now); osc.stop(now + 0.35);
            } else if (type === "miss") {
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.linearRampToValueAtTime(90, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            }
        } catch(e) {}
    }

    let model, webcam, maxPredictions;
    let serialPort, serialWriter;

    // 遊戲流變數
    let actionQueue = [];
    const QUEUE_LENGTH = 5;
    let isRunning = false;
    let isLocked = false;
    let score = 0;
    let combo = 0;
    let roundStart = 0;
    const TIME_LIMIT_MS = 3000;
    let timerLoop = null;
    let eventLogs = [];

    // ================= 步驟 1：WebSerial 連接 =================
    async function connectSerial() {
        try {
            serialPort = await navigator.serial.requestPort();
            await serialPort.open({ baudRate: 115200 });
            const enc = new TextEncoderStream();
            enc.readable.pipeTo(serialPort.writable);
            serialWriter = enc.writable.getWriter();

            // 更新步驟 1 UI
            step1Ready = true;
            document.getElementById("card-step1").classList.add("done");
            document.getElementById("tag-step1").innerText = "已連線 🟢";
            document.getElementById("btn-step1").innerText = "✔ 連線成功";
            document.getElementById("btn-step1").classList.add("ready-btn");
            checkCanUnlockStep3();
        } catch (e) {
            alert("Serial 連接取消或失敗: " + e.message);
        }
    }

    // ================= 步驟 2：AI 模型與鏡頭 =================
    async function initAI() {
        let url = document.getElementById("modelUrl").value.trim();
        if (!url) { alert("請先填寫 Teachable Machine 網址！"); return; }
        if (!url.endsWith("/")) url += "/";

        const btn = document.getElementById("btn-step2");
        btn.innerText = "載入中，請稍候...";
        btn.disabled = true;

        try {
            model = await tmImage.load(url + "model.json", url + "metadata.json");
            maxPredictions = model.getTotalClasses();

            webcam = new tmImage.Webcam(220, 150, true);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(predictLoop);

            document.getElementById("webcam-container").innerHTML = "";
            document.getElementById("webcam-container").appendChild(webcam.canvas);

            const mBox = document.getElementById("meters-container");
            mBox.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                const row = document.createElement("div");
                row.className = "meter-row";
                row.id = "meter-row-" + i;
                mBox.appendChild(row);
            }

            // 更新步驟 2 UI
            step2Ready = true;
            document.getElementById("card-step2").classList.add("done");
            document.getElementById("tag-step2").innerText = "已就緒 🟢";
            btn.innerText = "✔ 模型與鏡頭就緒";
            btn.classList.add("ready-btn");
            btn.disabled = false;
            checkCanUnlockStep3();
        } catch (e) {
            btn.innerText = "重新載入模型";
            btn.disabled = false;
            alert("模型載入失敗，請確認網址正確: " + e.message);
        }
    }

    // ================= 檢查並解鎖步驟 3 =================
    function checkCanUnlockStep3() {
        if (step1Ready && step2Ready) {
            document.getElementById("card-step3").classList.add("done");
            document.getElementById("tag-step3").innerText = "準備就緒 ✨";
            document.getElementById("desc-step3").innerText = "一切就緒！點擊下方按鈕出發";

            const launchBtn = document.getElementById("btn-launch");
            launchBtn.disabled = false;
            launchBtn.innerText = "🚀 開始攀爬競技！";
            launchBtn.classList.add("unlocked");
        }
    }

    async function predictLoop() {
        webcam.update();
        await evaluateTarget();
        window.requestAnimationFrame(predictLoop);
    }

    // 實時推論比對
    async function evaluateTarget() {
        if (!model) return;
        const predictions = await model.predict(webcam.canvas);

        let topCls = "";
        let topProb = 0;

        for (let i = 0; i < maxPredictions; i++) {
            const name = predictions[i].className;
            const prob = predictions[i].probability;
            const row = document.getElementById("meter-row-" + i);
            const g = GESTURES[name] || { symbol: "", name: name, num: "" };

            row.innerHTML = `<span>${g.symbol} ${g.name}</span><span>${(prob*100).toFixed(0)}%</span>`;

            if (prob > topProb) {
                topProb = prob;
                topCls = name;
            }
            if (prob > 0.75) {
                row.classList.add("matched");
            } else {
                row.classList.remove("matched");
            }
        }

        if (isRunning && !isLocked && actionQueue.length > 0) {
            const currentTarget = actionQueue[0];
            if (topCls === currentTarget && topProb > 0.75) {
                handleSuccess(topCls, topProb);
            }
        }
    }

    // ================= 步驟 3：開始遊戲 =================
    function startGame() {
        isRunning = true;
        isLocked = false;
        score = 0;
        combo = 0;
        eventLogs = [];
        updateHUD();

        const launchBtn = document.getElementById("btn-launch");
        launchBtn.innerText = "🎮 競技進行中...";
        launchBtn.classList.remove("unlocked");
        launchBtn.disabled = true;

        actionQueue = [];
        for (let i = 0; i < QUEUE_LENGTH; i++) {
            actionQueue.push(getRandomGesture());
        }
        renderQueue();
        startTimer();
    }

    function getRandomGesture() {
        return ACTIVE_TARGETS[Math.floor(Math.random() * ACTIVE_TARGETS.length)];
    }

    function renderQueue() {
        const ribbon = document.getElementById("queue-ribbon");
        ribbon.innerHTML = "";

        actionQueue.forEach((clsKey, index) => {
            const g = GESTURES[clsKey];
            const card = document.createElement("div");
            card.className = "action-card " + (index === 0 ? "active-target" : "upcoming");
            card.innerHTML = `
                <div class="symbol">${g.symbol}</div>
                <div class="c-name">${g.name}</div>
                <div class="sub-num">${g.num}</div>
            `;
            ribbon.appendChild(card);
        });
    }

    function startTimer() {
        clearInterval(timerLoop);
        roundStart = performance.now();
        const bar = document.getElementById("timer-bar");

        timerLoop = setInterval(() => {
            const elapsed = performance.now() - roundStart;
            const remaining = Math.max(0, TIME_LIMIT_MS - elapsed);
            const pct = (remaining / TIME_LIMIT_MS) * 100;

            bar.style.width = pct + "%";
            if (pct > 40) bar.style.background = "var(--neon-blue)";
            else bar.style.background = "var(--neon-pink)";

            if (remaining <= 0) {
                clearInterval(timerLoop);
                handleTimeout();
            }
        }, 30);
    }

    async function handleSuccess(matchedCls, prob) {
        isLocked = true;
        clearInterval(timerLoop);

        const duration = Math.round(performance.now() - roundStart);
        score++;
        combo++;

        if (combo >= 3) {
            playSfx("combo");
            popSplash("🔥 " + combo + "x COMBO!", "var(--neon-yellow)");
            if (typeof confetti === "function") {
                confetti({ particleCount: 25, spread: 60, origin: { y: 0.6 } });
            }
        } else {
            playSfx("hit");
            popSplash("PERFECT! ⚡", "var(--neon-green)");
        }

        updateHUD();

        eventLogs.push({
            timestamp: new Date().toISOString(),
            target: actionQueue[0],
            matched: matchedCls,
            durationMs: duration,
            status: "HIT"
        });

        // 經 WebSerial 送 1\n 讓 Tx 驅動機械人推進
        if (serialWriter) {
            try { await serialWriter.write("1\n"); } catch(e) {}
        }

        actionQueue.shift();
        actionQueue.push(getRandomGesture());
        renderQueue();

        setTimeout(() => {
            isLocked = false;
            if (isRunning) startTimer();
        }, 800);
    }

    function handleTimeout() {
        combo = 0;
        playSfx("miss");
        popSplash("MISS! ✖", "var(--neon-pink)");
        updateHUD();

        eventLogs.push({
            timestamp: new Date().toISOString(),
            target: actionQueue[0],
            matched: "NONE",
            durationMs: TIME_LIMIT_MS,
            status: "TIMEOUT"
        });

        actionQueue.shift();
        actionQueue.push(getRandomGesture());
        renderQueue();
        if (isRunning) startTimer();
    }

    function popSplash(text, color) {
        const el = document.getElementById("splash-text");
        el.innerText = text;
        el.style.color = color;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 450);
    }

    function updateHUD() {
        document.getElementById("score-counter").innerText = score;
        const comboEl = document.getElementById("combo-display");
        comboEl.innerText = combo + "x COMBO";
        comboEl.classList.add("pop");
        setTimeout(() => comboEl.classList.remove("pop"), 120);

        const climbPct = Math.min(92, (score / 15) * 92);
        document.getElementById("robot-indicator").style.bottom = climbPct + "%";
    }

    // 上傳成績至 Google Drive
    async function uploadDataToDrive() {
        if (!GAS_ENDPOINT || GAS_ENDPOINT.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
            alert("請先填寫 Google Apps Script 網址！");
            return;
        }

        const payload = {
            folderId: DRIVE_FOLDER_ID,
            groupId: document.getElementById("groupId").value || "G_Unknown",
            studentId: document.getElementById("studentId").value || "S_Unknown",
            condition: document.getElementById("conditionType").value,
            score: score,
            comments: "",
            logs: eventLogs
        };

        try {
            await fetch(GAS_ENDPOINT, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            alert("比賽日誌已成功儲存至 Google Drive！");
        } catch (err) {
            alert("上傳失敗: " + err.message);
        }
    }
</script>
