<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser Few-Shot CNN & Grad-CAM Data Quality Diagnostic Studio</title>
    <!-- 核心依賴：TensorFlow.js 官方庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <style>
        :root {
            --bg-base: #f8fafc;
            --bg-card: #ffffff;
            --border-ui: #cbd5e1;
            --text-main: #0f172a;
            --text-sub: #475569;
            --accent-blue: #0284c7;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text-main);
            min-height: 100vh;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-strip {
            background: var(--bg-card);
            padding: 14px 20px;
            border-radius: 14px;
            border: 1px solid var(--border-ui);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
        }
        .header-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 16px;
        }

        /* 左側鏡頭與推論看板 */
        .camera-card {
            background: var(--bg-card);
            border: 2px solid var(--border-ui);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
        }
        .viewport-box {
            position: relative;
            width: 100%;
            height: 245px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-ui);
        }
        #webcam-video {
            display: none;
        }
        #main-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hud-status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.85);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
        }

        .meters-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .meter-row {
            background: #f8fafc;
            border: 1px solid var(--border-ui);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .meter-row.matched {
            background: #dcfce7;
            border-color: #86efac;
            color: #15803d;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
        }

        /* 右側樣本採集與訓練面板 */
        .workbench-card {
            background: var(--bg-card);
            border: 2px solid var(--border-ui);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .action-toolbar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            background: #334155;
            color: #ffffff;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:hover { background: #1e293b; }
        .btn.primary { background: var(--accent-blue); }
        .btn.primary:hover { background: #0369a1; }
        .btn.success { background: var(--accent-green); }
        .btn.success:hover { background: #059669; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 類別採樣網格 */
        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }
        .class-box {
            background: #f8fafc;
            border: 2px solid var(--border-ui);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            text-align: center;
        }
        .class-box.active {
            border-color: var(--accent-blue);
            background: #f0f9ff;
        }
        .class-title {
            font-weight: 800;
            font-size: 13px;
        }
        .sample-thumb-slot {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            background: #e2e8f0;
            border: 1.5px dashed #94a3b8;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sample-thumb-slot canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .quality-tag {
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            margin-top: 2px;
        }
        .quality-tag.good { background: #dcfce7; color: #15803d; }
        .quality-tag.noise { background: #fee2e2; color: #b91c1c; }
        .quality-tag.empty { background: #f1f5f9; color: #94a3b8; }

        .btn-capture-slot {
            width: 100%;
            padding: 6px;
            font-size: 11px;
            font-weight: bold;
            background: #ffffff;
            border: 1px solid var(--border-ui);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-capture-slot:hover { background: #e2e8f0; }
        .btn-capture-slot:active { background: var(--accent-blue); color: #fff; }

        /* 底部診斷說明 */
        .diagnostic-card {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 12px;
            line-height: 1.5;
            color: #1e40af;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 頂部資訊列 -->
    <div class="header-strip">
        <div class="header-title">
            <span>🔬 本地卷積特徵提取與 Grad-CAM 樣本質素診斷室</span>
        </div>
        <div id="engine-status" style="font-size: 12px; font-weight: bold; color: var(--accent-amber);">
            正在下載 MobileNet 基礎卷積網絡...
        </div>
    </div>

    <div class="main-grid">
        <!-- 左側：實時鏡頭與預測 Grad-CAM -->
        <div class="camera-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:800; font-size:14px;">📷 實時推論熱力圖視野</span>
                <label style="font-size:11px; color:var(--text-sub); display:flex; align-items:center; gap:4px; cursor:pointer;">
                    <input type="checkbox" id="toggle-gradcam" checked> 開啟熱力圖
                </label>
            </div>

            <div class="viewport-box">
                <video id="webcam-video" playsinline></video>
                <canvas id="main-canvas" width="224" height="224"></canvas>
                <div class="hud-status" id="hud-status">模型待訓練</div>
            </div>

            <div class="meters-list" id="meters-box">
                <!-- 預測機率即時列表 -->
            </div>
        </div>

        <!-- 右側：採樣工作台與樣本質素診斷 -->
        <div class="workbench-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:800; font-size:14px;">🖐️ 數據集工作台（支援一類一張樣本）</span>
                <span style="font-size:11px; color:var(--text-sub);">鏡頭前擺好手勢，按下方「📸 拍攝」即可截取</span>
            </div>

            <!-- 5 款類別採樣區 -->
            <div class="classes-grid" id="classes-grid">
                <!-- 動態注入類別卡片 -->
            </div>

            <div class="action-toolbar">
                <button class="btn primary" id="btn-train" onclick="trainModel()" disabled>
                    ⚡ 一鍵本地訓練模型 (Transfer Learning)
                </button>
                <button class="btn success" id="btn-diagnose" onclick="diagnoseDatasetQuality()" disabled>
                    🔍 檢驗訓練樣本 Grad-CAM 質素
                </button>
            </div>

            <div class="diagnostic-card">
                <b>💡 學生除錯指引（點解準確率得 50–75%？）：</b><br>
                1. <b>採樣後按「檢驗質素」：</b> 系統會回頭為你的訓練照片計算 Grad-CAM 熱力圖。<br>
                2. <b>紅點如果在手勢上（🟢 數據優質）：</b> 代表特徵正確抓取。<br>
                3. <b>紅點如果落在背後窗簾、花衣服或書架（🔴 背景雜音）：</b> 這就是 CNN 誤判的核心成因！請學生清理背景或將鏡頭轉向純白牆，即可親身見證命中率重回 90% 以上！
            </div>
        </div>
    </div>

</div>

<script>
    const CLASSES = [
        { id: "c1", name: "石頭 ✊", key: "Rock" },
        { id: "c2", name: "剪刀 ✌️", key: "Scissors" },
        { id: "c3", name: "布 🖐️",   key: "Paper" },
        { id: "c4", name: "讚好 👍", key: "Like" },
        { id: "c5", name: "待機 🫱", key: "Idle" }
    ];

    let truncatedMobileNet = null;
    let customTopModel = null;
    let videoEl = document.getElementById("webcam-video");
    let mainCanvas = document.getElementById("main-canvas");
    let mainCtx = mainCanvas.getContext("2d");

    let classSamples = {}; // 儲存各類別已採樣的 Canvas 元素
    let isModelTrained = false;
    let isPredicting = false;

    // 1. 初始化頁面結構與鏡頭
    async function initPlatform() {
        renderClassBoxes();
        renderMeters();
        await setupCamera();
        await loadFeatureExtractor();
    }

    function renderClassBoxes() {
        const grid = document.getElementById("classes-grid");
        grid.innerHTML = "";
        CLASSES.forEach((c, idx) => {
            classSamples[c.id] = null;
            const box = document.createElement("div");
            box.className = "class-box";
            box.id = `box-${c.id}`;
            box.innerHTML = `
                <div class="class-title">${c.name}</div>
                <div class="sample-thumb-slot" id="slot-${c.id}">
                    <span style="color:#94a3b8; font-size:10px;">未採樣</span>
                </div>
                <span class="quality-tag empty" id="tag-${c.id}">等待數據</span>
                <button class="btn-capture-slot" onclick="captureSample('${c.id}')">📸 拍攝此類別</button>
            `;
            grid.appendChild(box);
        });
    }

    function renderMeters() {
        const box = document.getElementById("meters-box");
        box.innerHTML = "";
        CLASSES.forEach(c => {
            const row = document.createElement("div");
            row.className = "meter-row";
            row.id = `meter-${c.id}`;
            row.innerHTML = `<span>${c.name}</span><span id="prob-${c.id}">0%</span>`;
            box.appendChild(row);
        });
    }

    async function setupCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 224, height: 224, facingMode: "user" }
            });
            videoEl.srcObject = stream;
            await new Promise(resolve => videoEl.onloadedmetadata = resolve);
            videoEl.play();
            requestAnimationFrame(videoRenderLoop);
        } catch (e) {
            alert("鏡頭啟動失敗: " + e.message);
        }
    }

    // 2. 本地直接載入 MobileNet 卷積基底（毋須任何 GTM 檔案）
    async function loadFeatureExtractor() {
        const statusEl = document.getElementById("engine-status");
        try {
            // 直接載入官方輕量 MobileNet v1 (0.25 寬度系數，極致輕量，下載僅約 1.8MB)
            const mobilenet = await tf.loadLayersModel('https://storage.googleapis.com/tfjs-models/tfjs/mobilenet_v1_0.25_224/model.json');
            
            // 截取至最後一層核心卷積層 conv_pw_13_relu (Shape: [1, 7, 7, 256])
            const layer = mobilenet.getLayer('conv_pw_13_relu');
            truncatedMobileNet = tf.model({ inputs: mobilenet.inputs, outputs: layer.output });

            statusEl.innerText = "✔ MobileNet 卷積基底就緒！請為各類別拍攝樣本";
            statusEl.style.color = "var(--accent-green)";
        } catch (err) {
            statusEl.innerText = "基底下載失敗，請檢查網絡連線: " + err.message;
            statusEl.style.color = "var(--accent-rose)";
        }
    }

    // 3. 採樣邏輯：從畫面上截取正方形影像
    function captureSample(classId) {
        const slot = document.getElementById(`slot-${classId}`);
        const tag = document.getElementById(`tag-${classId}`);

        const canvas = document.createElement("canvas");
        canvas.width = 224;
        canvas.height = 224;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(videoEl, 0, 0, 224, 224);

        classSamples[classId] = canvas;
        slot.innerHTML = "";
        slot.appendChild(canvas);

        tag.className = "quality-tag empty";
        tag.innerText = "已採樣 1 張";

        // 檢查是否至少有 2 個類別已拍照
        const capturedCount = Object.values(classSamples).filter(v => v !== null).length;
        if (capturedCount >= 2) {
            document.getElementById("btn-train").disabled = false;
        }
    }

    // 4. 一鍵本地遷移訓練（Transfer Learning）
    async function trainModel() {
        const btnTrain = document.getElementById("btn-train");
        btnTrain.innerText = "⚡ 本地學習中 (約 1 秒)...";
        btnTrain.disabled = true;

        // 構建特徵張量與標籤
        const features = [];
        const labels = [];
        const activeClassIndices = [];

        CLASSES.forEach((c, idx) => {
            if (classSamples[c.id]) {
                activeClassIndices.push(idx);
                tf.tidy(() => {
                    const imgTensor = tf.browser.fromPixels(classSamples[c.id]).toFloat().div(127.5).sub(1.0).expandDims(0);
                    const feat = truncatedMobileNet.predict(imgTensor);
                    features.push(feat);
                });
                // One-hot 標籤
                const l = new Array(CLASSES.length).fill(0);
                l[idx] = 1.0;
                labels.push(l);
            }
        });

        const xs = tf.concat(features, 0);
        const ys = tf.tensor2d(labels);

        // 構建頂層分類器 (GAP + Dense Softmax)
        customTopModel = tf.sequential({
            layers: [
                tf.layers.globalAveragePooling2d({ inputShape: [7, 7, 256] }),
                tf.layers.dense({ units: CLASSES.length, activation: 'softmax', kernelInitializer: 'varianceScaling' })
            ]
        });

        customTopModel.compile({
            optimizer: tf.train.adam(0.01),
            loss: 'categoricalCrossentropy'
        });

        await customTopModel.fit(xs, ys, {
            epochs: 35,
            batchSize: Math.max(1, features.length),
            shuffle: true
        });

        xs.dispose();
        ys.dispose();
        features.forEach(f => f.dispose());

        isModelTrained = true;
        btnTrain.innerText = "✔ 學習完成！實時預測中";
        btnTrain.classList.add("success");
        document.getElementById("btn-diagnose").disabled = false;
        document.getElementById("hud-status").innerText = "實時推論中";
    }

    // 5. 核心：Grad-CAM 計算演算法
    function computeGradCAM(inputTensor, targetClassIdx) {
        return tf.tidy(() => {
            const convOutput = truncatedMobileNet.predict(inputTensor); // [1, 7, 7, 256]
            const scoreFn = (act) => {
                const pooled = act.mean([1, 2]); // GAP
                const logits = customTopModel.apply(act);
                return logits.gather([targetClassIdx], 1).as1D();
            };
            const gradFn = tf.grad(scoreFn);
            const grads = gradFn(convOutput); // [1, 7, 7, 256]
            const weights = grads.mean([0, 1, 2]); // [256]
            const cam = convOutput.squeeze(0).mul(weights).sum(-1); // [7, 7]
            const reluCam = tf.relu(cam);
            const min = reluCam.min();
            const max = reluCam.max();
            return reluCam.sub(min).div(max.sub(min).add(1e-8)); // 歸一化 [7, 7]
        });
    }

    // 6. 訓練樣本質素診斷（解決「點解準確率得 50-75%」的關鍵功能）
    async function diagnoseDatasetQuality() {
        if (!isModelTrained) return;

        CLASSES.forEach(async (c, idx) => {
            const canvas = classSamples[c.id];
            if (!canvas) return;

            const inputTensor = tf.tidy(() => {
                return tf.browser.fromPixels(canvas).toFloat().div(127.5).sub(1.0).expandDims(0);
            });

            const camTensor = computeGradCAM(inputTensor, idx);
            inputTensor.dispose();

            const camData = await camTensor.data();
            camTensor.dispose();

            // 在樣本縮圖上繪製熱力圖疊加
            const ctx = canvas.getContext("2d");
            ctx.drawImage(videoEl, 0, 0, 224, 224); // 重繪原圖

            const heatCanvas = document.createElement("canvas");
            heatCanvas.width = 7;
            heatCanvas.height = 7;
            const hCtx = heatCanvas.getContext("2d");
            const imgData = hCtx.createImageData(7, 7);

            let centerActivationSum = 0;
            let totalActivationSum = 0;

            for (let i = 0; i < 49; i++) {
                const val = camData[i];
                totalActivationSum += val;
                const x = i % 7;
                const y = Math.floor(i / 7);
                // 檢查是否落在畫面中心手勢區域 (x: 2~4, y: 2~4)
                if (x >= 2 && x <= 4 && y >= 2 && y <= 4) {
                    centerActivationSum += val;
                }
                const [r, g, b, a] = getJetColor(val);
                imgData.data[i * 4] = r;
                imgData.data[i * 4 + 1] = g;
                imgData.data[i * 4 + 2] = b;
                imgData.data[i * 4 + 3] = a;
            }
            hCtx.putImageData(imgData, 0, 0);

            // 平滑放大疊加於樣本照片
            ctx.save();
            ctx.globalAlpha = 0.65;
            ctx.imageSmoothingEnabled = true;
            ctx.drawImage(heatCanvas, 0, 0, 224, 224);
            ctx.restore();

            // 評判數據品質：中央權重 vs 背景雜音
            const tag = document.getElementById(`tag-${c.id}`);
            const centerRatio = centerActivationSum / (totalActivationSum + 1e-5);
            if (centerRatio > 0.45) {
                tag.className = "quality-tag good";
                tag.innerText = "🟢 聚焦手勢 (優質)";
            } else {
                tag.className = "quality-tag noise";
                tag.innerText = "🔴 背景干擾 (需重拍)";
            }
        });
    }

    // 7. 即時推論與相機疊加 Loop
    let predictThrottle = 0;
    let cachedLiveCamCanvas = null;

    async function videoRenderLoop() {
        mainCtx.drawImage(videoEl, 0, 0, 224, 224);

        if (isModelTrained) {
            predictThrottle++;
            if (predictThrottle % 2 === 0) {
                await runLiveInference();
            }
            if (document.getElementById("toggle-gradcam").checked && cachedLiveCamCanvas) {
                mainCtx.save();
                mainCtx.globalAlpha = 0.55;
                mainCtx.drawImage(cachedLiveCamCanvas, 0, 0, 224, 224);
                mainCtx.restore();
            }
        }
        requestAnimationFrame(videoRenderLoop);
    }

    async function runLiveInference() {
        const inputTensor = tf.tidy(() => {
            return tf.browser.fromPixels(videoEl).toFloat().div(127.5).sub(1.0).expandDims(0);
        });

        // 預測機率
        const probsTensor = tf.tidy(() => {
            const feat = truncatedMobileNet.predict(inputTensor);
            return customTopModel.predict(feat);
        });

        const probs = await probsTensor.data();
        probsTensor.dispose();

        let topIdx = 0, topProb = 0;
        CLASSES.forEach((c, idx) => {
            const p = probs[idx] || 0;
            document.getElementById(`prob-${c.id}`).innerText = `${(p * 100).toFixed(0)}%`;
            const row = document.getElementById(`meter-${c.id}`);
            if (p > 0.65) row.classList.add("matched");
            else row.classList.remove("matched");

            if (p > topProb) { topProb = p; topIdx = idx; }
        });

        // 計算 Live Grad-CAM
        if (document.getElementById("toggle-gradcam").checked) {
            const camTensor = computeGradCAM(inputTensor, topIdx);
            const camData = await camTensor.data();
            camTensor.dispose();

            if (!cachedLiveCamCanvas) {
                cachedLiveCamCanvas = document.createElement("canvas");
                cachedLiveCamCanvas.width = 7;
                cachedLiveCamCanvas.height = 7;
            }
            const hCtx = cachedLiveCamCanvas.getContext("2d");
            const imgData = hCtx.createImageData(7, 7);
            for (let i = 0; i < 49; i++) {
                const [r, g, b, a] = getJetColor(camData[i]);
                imgData.data[i * 4] = r;
                imgData.data[i * 4 + 1] = g;
                imgData.data[i * 4 + 2] = b;
                imgData.data[i * 4 + 3] = a;
            }
            hCtx.putImageData(imgData, 0, 0);
        }

        inputTensor.dispose();
    }

    function getJetColor(val) {
        val = Math.max(0, Math.min(1, val));
        if (val < 0.2) return [0, 0, 0, 0]; // 弱激活完全透明
        const norm = (val - 0.2) / 0.8;
        let r = 0, g = 0, b = 0;
        if (norm < 0.25) { r = 0; g = Math.round(255 * (norm / 0.25)); b = 255; }
        else if (norm < 0.5) { r = 0; g = 255; b = Math.round(255 * (1 - (norm - 0.25) / 0.25)); }
        else if (norm < 0.75) { r = Math.round(255 * ((norm - 0.5) / 0.25)); g = 255; b = 0; }
        else { r = 255; g = Math.round(255 * (1 - (norm - 0.75) / 0.25)); b = 0; }
        return [r, g, b, Math.round(100 + norm * 140)];
    }

    window.onload = initPlatform;
</script>
