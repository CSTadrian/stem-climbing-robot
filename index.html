<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser CNN Training & Grad-CAM Quality Studio</title>
    <!-- 核心依賴：TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <style>
        :root {
            --bg-base: #f8fafc;
            --bg-card: #ffffff;
            --border-ui: #cbd5e1;
            --text-main: #0f172a;
            --text-sub: #475569;
            --accent-blue: #0284c7;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text-main);
            min-height: 100vh;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-strip {
            background: var(--bg-card);
            padding: 14px 20px;
            border-radius: 14px;
            border: 1px solid var(--border-ui);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
        }
        .header-title {
            font-size: 17px;
            font-weight: 900;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 16px;
        }

        /* 左側鏡頭看板 */
        .camera-card {
            background: var(--bg-card);
            border: 2px solid var(--border-ui);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
        }
        .viewport-box {
            position: relative;
            width: 100%;
            height: 245px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-ui);
        }
        #webcam-video { display: none; }
        #main-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hud-status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.85);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
        }

        .meters-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .meter-row {
            background: #f8fafc;
            border: 1px solid var(--border-ui);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .meter-row.matched {
            background: #dcfce7;
            border-color: #86efac;
            color: #15803d;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
        }

        /* 右側多圖採樣工作台 */
        .workbench-card {
            background: var(--bg-card);
            border: 2px solid var(--border-ui);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 10px;
        }
        .class-box {
            background: #f8fafc;
            border: 2px solid var(--border-ui);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            text-align: center;
        }
        .class-title { font-weight: 800; font-size: 13px; }
        .sample-thumb-slot {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            background: #e2e8f0;
            border: 1.5px dashed #94a3b8;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sample-thumb-slot canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .sample-count-badge {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-blue);
        }
        .quality-tag {
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
        }
        .quality-tag.good { background: #dcfce7; color: #15803d; }
        .quality-tag.noise { background: #fee2e2; color: #b91c1c; }
        .quality-tag.empty { background: #f1f5f9; color: #94a3b8; }

        .btn-group-mini {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            width: 100%;
        }
        .btn-mini {
            padding: 6px 2px;
            font-size: 10px;
            font-weight: bold;
            background: #ffffff;
            border: 1px solid var(--border-ui);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-mini:hover { background: #e2e8f0; }
        .btn-mini.danger:hover { background: #fee2e2; color: #b91c1c; }

        .action-toolbar {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 10px;
        }
        .btn {
            background: #334155;
            color: #ffffff;
            border: none;
            padding: 12px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:hover { background: #1e293b; }
        .btn.primary { background: var(--accent-blue); }
        .btn.primary:hover { background: #0369a1; }
        .btn.success { background: var(--accent-green); }
        .btn.success:hover { background: #059669; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .diagnostic-card {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 12px;
            line-height: 1.5;
            color: #1e40af;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header-strip">
        <div class="header-title">
            <span>🔬 本地 CNN 多圖訓練與 Grad-CAM 樣本質素診斷室</span>
        </div>
        <div id="engine-status" style="font-size: 12px; font-weight: bold; color: var(--accent-amber);">
            正在下載 MobileNet 基礎特徵網絡...
        </div>
    </div>

    <div class="main-grid">
        <!-- 左側：即時推論與即時熱力圖 -->
        <div class="camera-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:800; font-size:14px;">📷 即時推論與熱力圖</span>
                <label style="font-size:11px; color:var(--text-sub); display:flex; align-items:center; gap:4px; cursor:pointer;">
                    <input type="checkbox" id="toggle-gradcam" checked> 開啟熱力圖
                </label>
            </div>

            <div class="viewport-box">
                <video id="webcam-video" playsinline></video>
                <canvas id="main-canvas" width="224" height="224"></canvas>
                <div class="hud-status" id="hud-status">模型待訓練</div>
            </div>

            <div class="meters-list" id="meters-box"></div>
        </div>

        <!-- 右側：多圖採樣與訓練工作台 -->
        <div class="workbench-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:800; font-size:14px;">🖐️ 數據集採樣區（建議每款手勢採集 5–8 張）</span>
                <span style="font-size:11px; color:var(--text-sub);">按「連拍 5 張」時請稍微微調手腕角度</span>
            </div>

            <div class="classes-grid" id="classes-grid"></div>

            <div class="action-toolbar">
                <button class="btn primary" id="btn-train" onclick="trainModel()" disabled>
                    ⚡ 一鍵極速訓練模型 (Transfer Learning)
                </button>
                <button class="btn success" id="btn-diagnose" onclick="diagnoseDatasetQuality()" disabled>
                    🔍 檢驗樣本 Grad-CAM 質素
                </button>
            </div>

            <div class="diagnostic-card">
                <b>💡 學生除錯操作指引：</b><br>
                1. <b>多角度採集：</b> 影相時嘗試前後微調距離、手腕左右輕微偏轉，讓 CNN 學習泛化特徵。<br>
                2. <b>點擊「檢驗樣本質素」：</b> 縮圖會覆蓋熱力圖。如果紅點落在手部（🟢 聚焦手勢），代表樣本高質；如果紅點落在花衣服或背後雜物（🔴 背景干擾），請按「清空」並將鏡頭轉向白牆重影！
            </div>
        </div>
    </div>

</div>

<script>
    const CLASSES = [
        { id: "c1", name: "石頭 ✊", key: "Rock" },
        { id: "c2", name: "剪刀 ✌️", key: "Scissors" },
        { id: "c3", name: "布 🖐️",   key: "Paper" },
        { id: "c4", name: "讚好 👍", key: "Like" },
        { id: "c5", name: "待機 🫱", key: "Idle" }
    ];

    let truncatedMobileNet = null;
    let customTopModel = null;
    let videoEl = document.getElementById("webcam-video");
    let mainCanvas = document.getElementById("main-canvas");
    let mainCtx = mainCanvas.getContext("2d");

    // 數據集結構：每個類別儲存多張圖片 Canvas 的 Array
    let classDatasets = {}; 
    let isModelTrained = false;

    async function initPlatform() {
        renderClassBoxes();
        renderMeters();
        await setupCamera();
        await loadFeatureExtractor();
    }

    function renderClassBoxes() {
        const grid = document.getElementById("classes-grid");
        grid.innerHTML = "";
        CLASSES.forEach(c => {
            classDatasets[c.id] = [];
            const box = document.createElement("div");
            box.className = "class-box";
            box.id = `box-${c.id}`;
            box.innerHTML = `
                <div class="class-title">${c.name}</div>
                <div class="sample-thumb-slot" id="slot-${c.id}">
                    <span style="color:#94a3b8; font-size:10px;">未採樣</span>
                </div>
                <div class="sample-count-badge" id="count-${c.id}">0 張照片</div>
                <span class="quality-tag empty" id="tag-${c.id}">等待數據</span>
                <div class="btn-group-mini">
                    <button class="btn-mini" onclick="captureSingle('${c.id}')">📸 單張</button>
                    <button class="btn-mini" onclick="burstCapture('${c.id}', 5)">⚡ 連拍 5 張</button>
                </div>
                <button class="btn-mini danger" style="width:100%;" onclick="clearClassData('${c.id}')">🗑️ 清空</button>
            `;
            grid.appendChild(box);
        });
    }

    function renderMeters() {
        const box = document.getElementById("meters-box");
        box.innerHTML = "";
        CLASSES.forEach(c => {
            const row = document.createElement("div");
            row.className = "meter-row";
            row.id = `meter-${c.id}`;
            row.innerHTML = `<span>${c.name}</span><span id="prob-${c.id}">0%</span>`;
            box.appendChild(row);
        });
    }

    async function setupCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 224, height: 224, facingMode: "user" }
            });
            videoEl.srcObject = stream;
            await new Promise(resolve => videoEl.onloadedmetadata = resolve);
            videoEl.play();
            requestAnimationFrame(videoRenderLoop);
        } catch (e) {
            alert("鏡頭啟動失敗: " + e.message);
        }
    }

    // 載入輕量 MobileNet v1 (0.25 寬度系數，下載僅 1.8MB)
    async function loadFeatureExtractor() {
        const statusEl = document.getElementById("engine-status");
        try {
            const mobilenet = await tf.loadLayersModel('https://storage.googleapis.com/tfjs-models/tfjs/mobilenet_v1_0.25_224/model.json');
            const layer = mobilenet.getLayer('conv_pw_13_relu');
            truncatedMobileNet = tf.model({ inputs: mobilenet.inputs, outputs: layer.output });

            statusEl.innerText = "✔ MobileNet 基底就緒！請採集手勢照片";
            statusEl.style.color = "var(--accent-green)";
        } catch (err) {
            statusEl.innerText = "基底下載失敗，請檢查網絡: " + err.message;
            statusEl.style.color = "var(--accent-rose)";
        }
    }

    // 單張拍攝
    function captureSingle(classId) {
        const canvas = document.createElement("canvas");
        canvas.width = 224; canvas.height = 224;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(videoEl, 0, 0, 224, 224);

        classDatasets[classId].push(canvas);
        updateClassCardUI(classId);
    }

    // 連拍多張（每 200ms 抓一張，引導微調角度）
    function burstCapture(classId, count) {
        let captured = 0;
        const interval = setInterval(() => {
            captureSingle(classId);
            captured++;
            if (captured >= count) clearInterval(interval);
        }, 200);
    }

    function clearClassData(classId) {
        classDatasets[classId] = [];
        const slot = document.getElementById(`slot-${classId}`);
        slot.innerHTML = `<span style="color:#94a3b8; font-size:10px;">未採樣</span>`;
        document.getElementById(`count-${classId}`).innerText = "0 張照片";
        const tag = document.getElementById(`tag-${classId}`);
        tag.className = "quality-tag empty";
        tag.innerText = "等待數據";
        checkCanTrain();
    }

    function updateClassCardUI(classId) {
        const list = classDatasets[classId];
        document.getElementById(`count-${classId}`).innerText = `${list.length} 張照片`;
        
        // 更新縮圖為最新拍攝的一張
        const slot = document.getElementById(`slot-${classId}`);
        slot.innerHTML = "";
        const previewCanvas = document.createElement("canvas");
        previewCanvas.width = 80; previewCanvas.height = 80;
        previewCanvas.getContext("2d").drawImage(list[list.length - 1], 0, 0, 80, 80);
        slot.appendChild(previewCanvas);

        checkCanTrain();
    }

    function checkCanTrain() {
        const classesWithData = Object.values(classDatasets).filter(arr => arr.length > 0).length;
        document.getElementById("btn-train").disabled = (classesWithData < 2);
    }

    // 核心修復：極速且防記憶體崩潰的遷移學習 (Transfer Learning)
    async function trainModel() {
        const btnTrain = document.getElementById("btn-train");
        btnTrain.innerText = "⚡ 本地極速學習中...";
        btnTrain.disabled = true;

        try {
            // 1. 提取所有圖片的 [256] 維度池化特徵（正確保留 tensor，絕不提前銷毀）
            const featureList = [];
            const labelList = [];

            CLASSES.forEach((c, classIdx) => {
                const images = classDatasets[c.id];
                images.forEach(imgCanvas => {
                    const feat = tf.tidy(() => {
                        const imgTensor = tf.browser.fromPixels(imgCanvas).toFloat().div(127.5).sub(1.0).expandDims(0);
                        const convOut = truncatedMobileNet.predict(imgTensor); // [1, 7, 7, 256]
                        return convOut.mean([1, 2]); // GAP 池化為 [1, 256]
                    });
                    featureList.push(feat);

                    const oneHot = new Array(CLASSES.length).fill(0);
                    oneHot[classIdx] = 1.0;
                    labelList.push(oneHot);
                });
            });

            if (featureList.length === 0) return;

            const xs = tf.concat(featureList, 0); // [TotalSamples, 256]
            const ys = tf.tensor2d(labelList);

            // 清理臨時特徵列表
            featureList.forEach(f => f.dispose());

            // 2. 構建輕量頂層分類器 (直接接收 256 維向量，訓練只需 0.3 秒)
            customTopModel = tf.sequential({
                layers: [
                    tf.layers.dense({
                        inputShape: [256],
                        units: CLASSES.length,
                        activation: 'softmax',
                        kernelInitializer: 'varianceScaling'
                    })
                ]
            });

            customTopModel.compile({
                optimizer: tf.train.adam(0.01),
                loss: 'categoricalCrossentropy'
            });

            // 3. 快速擬合 (25 Epochs)
            await customTopModel.fit(xs, ys, {
                epochs: 25,
                batchSize: Math.min(16, featureList.length),
                shuffle: true
            });

            xs.dispose();
            ys.dispose();

            isModelTrained = true;
            btnTrain.innerText = "✔ 學習完成！實時預測中";
            btnTrain.classList.add("success");
            btnTrain.disabled = false;
            document.getElementById("btn-diagnose").disabled = false;
            document.getElementById("hud-status").innerText = "實時推論中";
        } catch (err) {
            alert("訓練過程發生錯誤: " + err.message);
            btnTrain.innerText = "重新訓練";
            btnTrain.disabled = false;
        }
    }

    // 穩健的 Grad-CAM 計算演算法（以純數學平均池化確保梯度精確回傳）
    function computeGradCAM(inputTensor, targetClassIdx) {
        return tf.tidy(() => {
            const convOutput = truncatedMobileNet.predict(inputTensor); // [1, 7, 7, 256]
            const scoreFn = (act) => {
                const pooled = act.mean([1, 2]); // [1, 256]
                const logits = customTopModel.apply(pooled); // [1, numClasses]
                return logits.gather([targetClassIdx], 1).as1D();
            };
            const gradFn = tf.grad(scoreFn);
            const grads = gradFn(convOutput); // [1, 7, 7, 256]
            const weights = grads.mean([0, 1, 2]); // [256]
            const cam = convOutput.squeeze(0).mul(weights).sum(-1); // [7, 7]
            const reluCam = tf.relu(cam);
            const min = reluCam.min();
            const max = reluCam.max();
            return reluCam.sub(min).div(max.sub(min).add(1e-8));
        });
    }

    // 樣本質素 Grad-CAM 診斷：為每個類別最新的一張照片驗證特徵聚焦點
    async function diagnoseDatasetQuality() {
        if (!isModelTrained) return;

        CLASSES.forEach(async (c, classIdx) => {
            const list = classDatasets[c.id];
            if (!list || list.length === 0) return;

            const targetImg = list[list.length - 1]; // 檢驗最新的一張
            const inputTensor = tf.tidy(() => {
                return tf.browser.fromPixels(targetImg).toFloat().div(127.5).sub(1.0).expandDims(0);
            });

            const camTensor = computeGradCAM(inputTensor, classIdx);
            inputTensor.dispose();

            const camData = await camTensor.data();
            camTensor.dispose();

            // 在縮圖槽上繪製熱力圖疊加
            const slot = document.getElementById(`slot-${c.id}`);
            slot.innerHTML = "";
            const diagCanvas = document.createElement("canvas");
            diagCanvas.width = 80; diagCanvas.height = 80;
            const dCtx = diagCanvas.getContext("2d");
            dCtx.drawImage(targetImg, 0, 0, 80, 80);

            // 生成 7x7 彩色熱力圖
            const heatCanvas = document.createElement("canvas");
            heatCanvas.width = 7; heatCanvas.height = 7;
            const hCtx = heatCanvas.getContext("2d");
            const imgData = hCtx.createImageData(7, 7);

            let centerSum = 0, totalSum = 0;
            for (let i = 0; i < 49; i++) {
                const val = camData[i];
                totalSum += val;
                const x = i % 7, y = Math.floor(i / 7);
                if (x >= 2 && x <= 4 && y >= 2 && y <= 4) centerSum += val; // 中心手勢區域
                const [r, g, b, a] = getJetColor(val);
                imgData.data[i * 4] = r;
                imgData.data[i * 4 + 1] = g;
                imgData.data[i * 4 + 2] = b;
                imgData.data[i * 4 + 3] = a;
            }
            hCtx.putImageData(imgData, 0, 0);

            dCtx.save();
            dCtx.globalAlpha = 0.65;
            dCtx.imageSmoothingEnabled = true;
            dCtx.drawImage(heatCanvas, 0, 0, 80, 80);
            dCtx.restore();

            slot.appendChild(diagCanvas);

            // 評判診斷結果
            const tag = document.getElementById(`tag-${c.id}`);
            const centerRatio = centerSum / (totalSum + 1e-5);
            if (centerRatio > 0.40) {
                tag.className = "quality-tag good";
                tag.innerText = "🟢 聚焦手勢 (優質)";
            } else {
                tag.className = "quality-tag noise";
                tag.innerText = "🔴 背景干擾 (需重影)";
            }
        });
    }

    // 即時推論與相機疊加 Loop
    let predictThrottle = 0;
    let cachedLiveCamCanvas = null;

    async function videoRenderLoop() {
        mainCtx.drawImage(videoEl, 0, 0, 224, 224);

        if (isModelTrained) {
            predictThrottle++;
            if (predictThrottle % 2 === 0) {
                await runLiveInference();
            }
            if (document.getElementById("toggle-gradcam").checked && cachedLiveCamCanvas) {
                mainCtx.save();
                mainCtx.globalAlpha = 0.55;
                mainCtx.drawImage(cachedLiveCamCanvas, 0, 0, 224, 224);
                mainCtx.restore();
            }
        }
        requestAnimationFrame(videoRenderLoop);
    }

    async function runLiveInference() {
        const inputTensor = tf.tidy(() => {
            return tf.browser.fromPixels(videoEl).toFloat().div(127.5).sub(1.0).expandDims(0);
        });

        const probsTensor = tf.tidy(() => {
            const convOut = truncatedMobileNet.predict(inputTensor);
            const pooled = convOut.mean([1, 2]);
            return customTopModel.predict(pooled);
        });

        const probs = await probsTensor.data();
        probsTensor.dispose();

        let topIdx = 0, topProb = 0;
        CLASSES.forEach((c, idx) => {
            const p = probs[idx] || 0;
            document.getElementById(`prob-${c.id}`).innerText = `${(p * 100).toFixed(0)}%`;
            const row = document.getElementById(`meter-${c.id}`);
            if (p > 0.65) row.classList.add("matched");
            else row.classList.remove("matched");

            if (p > topProb) { topProb = p; topIdx = idx; }
        });

        // 即時 Grad-CAM 計算
        if (document.getElementById("toggle-gradcam").checked) {
            const camTensor = computeGradCAM(inputTensor, topIdx);
            const camData = await camTensor.data();
            camTensor.dispose();

            if (!cachedLiveCamCanvas) {
                cachedLiveCamCanvas = document.createElement("canvas");
                cachedLiveCamCanvas.width = 7; cachedLiveCamCanvas.height = 7;
            }
            const hCtx = cachedLiveCamCanvas.getContext("2d");
            const imgData = hCtx.createImageData(7, 7);
            for (let i = 0; i < 49; i++) {
                const [r, g, b, a] = getJetColor(camData[i]);
                imgData.data[i * 4] = r;
                imgData.data[i * 4 + 1] = g;
                imgData.data[i * 4 + 2] = b;
                imgData.data[i * 4 + 3] = a;
            }
            hCtx.putImageData(imgData, 0, 0);
        }

        inputTensor.dispose();
    }

    function getJetColor(val) {
        val = Math.max(0, Math.min(1, val));
        if (val < 0.2) return [0, 0, 0, 0];
        const norm = (val - 0.2) / 0.8;
        let r = 0, g = 0, b = 0;
        if (norm < 0.25) { r = 0; g = Math.round(255 * (norm / 0.25)); b = 255; }
        else if (norm < 0.5) { r = 0; g = 255; b = Math.round(255 * (1 - (norm - 0.25) / 0.25)); }
        else if (norm < 0.75) { r = Math.round(255 * ((norm - 0.5) / 0.25)); g = 255; b = 0; }
        else { r = 255; g = Math.round(255 * (1 - (norm - 0.75) / 0.25)); b = 0; }
        return [r, g, b, Math.round(100 + norm * 140)];
    }

    window.onload = initPlatform;
</script>
