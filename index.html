<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Robot Gesture Arena - Arcade Edition</title>
    <!-- TensorFlow.js & Teachable Machine Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-dark: #131a29;
            --neon-blue: #00e5ff;
            --neon-green: #00ff88;
            --neon-yellow: #ffb700;
            --neon-red: #ff3366;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
        }

        .arena-container {
            max-width: 1080px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Top Config Strip */
        .config-panel {
            background: rgba(19, 26, 41, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 18px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1.5fr;
            gap: 10px;
            align-items: center;
        }
        input, select, textarea {
            background: #0b0f19;
            border: 1px solid #243048;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            width: 100%;
        }
        .btn-row {
            grid-column: span 4;
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }
        button {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.3);
        }
        button:hover { transform: translateY(-1px); filter: brightness(1.1); }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; box-shadow: none; }
        button.btn-start {
            background: linear-gradient(135deg, #059669, var(--neon-green));
            color: #042f2e;
            font-size: 15px;
            flex-grow: 1;
        }

        /* Rhythm Game Arcade Arena */
        .stage-card {
            background: rgba(19, 26, 41, 0.9);
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .score-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 12px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
        }
        .score-value {
            font-size: 38px;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
        }

        /* Kinect / Just Dance Style Gesture Ribbon */
        .ribbon-track-wrapper {
            background: #0b0f19;
            border-radius: 14px;
            padding: 16px;
            border: 2px solid #1e293b;
            position: relative;
        }
        .ribbon-track {
            display: flex;
            align-items: center;
            gap: 16px;
            min-height: 180px;
        }

        /* Action Flashcard */
        .flashcard {
            background: #141e33;
            border: 2px solid #243452;
            border-radius: 12px;
            min-width: 120px;
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        .flashcard .symbol { font-size: 52px; line-height: 1; margin-bottom: 6px; }
        .flashcard .gesture-name { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; }
        
        /* The Reminder Row: Number in very small subtle size */
        .flashcard .number-reminder {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        /* The Active "HIT ZONE" Card */
        .flashcard.active-target {
            min-width: 150px;
            height: 180px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 3px solid var(--neon-blue);
            transform: scale(1.05);
            box-shadow: 0 0 24px rgba(0, 229, 255, 0.35);
            z-index: 2;
        }
        .flashcard.active-target .symbol { font-size: 64px; }
        .flashcard.active-target::before {
            content: "⚡ HIT NOW";
            position: absolute;
            top: -12px;
            background: var(--neon-blue);
            color: #000;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 20px;
            box-shadow: 0 0 8px var(--neon-blue);
        }
        .flashcard.active-target .number-reminder {
            background: rgba(0, 229, 255, 0.2);
            color: var(--neon-blue);
        }

        .flashcard.upcoming { opacity: 0.65; transform: scale(0.92); }

        /* Timer Indicator Strip */
        .timer-strip-bg {
            height: 6px;
            background: #1e293b;
            border-radius: 4px;
            margin-top: 14px;
            overflow: hidden;
        }
        .timer-strip-bar {
            height: 100%;
            width: 100%;
            background: var(--neon-blue);
            transition: width 0.05s linear;
        }

        /* Feedback Popup Alert */
        #feedback-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-size: 40px;
            font-weight: 900;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease-out;
            z-index: 10;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #feedback-toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Dual Column: Video & Prediction + Data Logging */
        .bottom-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 16px;
        }
        .subcard {
            background: rgba(19, 26, 41, 0.85);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 14px;
        }
        #webcam-container {
            width: 320px;
            height: 240px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin: 0 auto 10px auto;
            border: 1px solid #243452;
        }
        .live-meter-badge {
            display: flex;
            justify-content: space-between;
            background: #0b0f19;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 4px;
            font-size: 12px;
            border: 1px solid #1e293b;
        }
        .live-meter-badge.matched {
            background: rgba(0, 255, 136, 0.15);
            border-color: var(--neon-green);
            color: var(--neon-green);
            font-weight: bold;
        }
        .log-box {
            height: 100px;
            background: #06090e;
            border-radius: 6px;
            padding: 8px;
            font-family: monospace;
            font-size: 11px;
            color: #38bdf8;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="arena-container">
    <!-- Configuration / Header Panel -->
    <div class="config-panel">
        <input type="text" id="groupId" placeholder="Group (e.g. Group-01)">
        <input type="text" id="studentId" placeholder="Student ID (e.g. S01)">
        <select id="conditionType">
            <option value="XAI_GradCAM">Group A (XAI Visuals)</option>
            <option value="No_XAI_Blackbox">Group B (Black-Box)</option>
        </select>
        <input type="text" id="modelUrl" placeholder="GTM Share Link (https://teachablemachine.withgoogle.com/models/.../)">
        
        <div class="btn-row">
            <button onclick="connectSerial()">1. Connect Tx micro:bit (USB)</button>
            <button onclick="initAI()" id="btn-ai">2. Load Model & Webcam</button>
            <button onclick="startGame()" id="btn-start" class="btn-start" disabled>3. START GAME</button>
        </div>
    </div>

    <!-- Main Arcade Arena (Xbox Kinect / Just Dance Style) -->
    <div class="stage-card">
        <div class="score-hud">
            <div>
                <span style="color: var(--text-muted); font-size: 12px; font-weight: bold; text-transform: uppercase;">Climbing Distance</span>
                <div class="score-value"><span id="score-counter">0</span> <span style="font-size: 18px; color: #94a3b8;">STEPS</span></div>
            </div>
            <div style="text-align: right;">
                <span style="color: var(--text-muted); font-size: 12px; font-weight: bold;">TIME REMAINING</span>
                <div id="clock-display" style="font-size: 24px; font-weight: 800; color: var(--neon-blue);">3.0s</div>
            </div>
        </div>

        <div class="ribbon-track-wrapper">
            <div class="ribbon-track" id="queue-ribbon">
                <!-- Dynamically populated: 1 Active Target + 4 Upcoming -->
            </div>
            <div class="timer-strip-bg">
                <div class="timer-strip-bar" id="timer-bar"></div>
            </div>
            <div id="feedback-toast">PERFECT!</div>
        </div>
    </div>

    <!-- Bottom: Live Camera Stream & Reflection / Cloud Sync -->
    <div class="bottom-grid">
        <!-- Left: Camera Preview & Confidence -->
        <div class="subcard">
            <h4 style="margin: 0 0 8px 0; font-size: 13px; color: #94a3b8;">PLAYER MOTION TRACKING</h4>
            <div id="webcam-container"></div>
            <div id="meter-container"></div>
        </div>

        <!-- Right: Event Log & Reflection Upload -->
        <div class="subcard" style="display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <h4 style="margin: 0 0 8px 0; font-size: 13px; color: #94a3b8;">ACTION LOGS</h4>
                <div class="log-box" id="log-box"></div>
            </div>
            <div style="margin-top: 10px;">
                <textarea id="studentComments" rows="2" placeholder="Student reflection / comments on model accuracy..."></textarea>
                <button onclick="uploadDataToDrive()" style="width: 100%; margin-top: 6px; background: #059669;">
                    📤 Submit Run Data to Drive (18VTaAPt86z7u4BCevGm96ZDF6uRdoODu)
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // 5 Classes configuration exactly matching the project guidelines
    const GESTURES = {
        "Class 1": { name: "石頭", symbol: "✊", num: "No. 1" },
        "Class 2": { name: "剪刀", symbol: "✌️", num: "No. 2" },
        "Class 3": { name: "布",   symbol: "🖐️", num: "No. 3" },
        "Class 4": { name: "讚好", symbol: "👍", num: "No. 4" },
        "Class 5": { name: "待機", symbol: "🫱", num: "No. 5" }
    };
    const ACTIVE_TARGETS = ["Class 1", "Class 2", "Class 3", "Class 4"]; // Class 5 is reserved for neutral standby

    const DRIVE_FOLDER_ID = "18VTaAPt86z7u4BCevGm96ZDF6uRdoODu";
    const GAS_ENDPOINT = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    let model, webcam, maxPredictions;
    let serialPort, serialWriter;

    // Game state
    let actionQueue = [];
    const QUEUE_LENGTH = 5;
    let isGameActive = false;
    let isCoolingDown = false;
    let score = 0;
    let roundStart = 0;
    const ROUND_LIMIT_MS = 3000;
    let gameLoopTimer = null;
    let eventLogs = [];

    // 1. WebSerial Connection to Transmitter micro:bit
    async function connectSerial() {
        try {
            serialPort = await navigator.serial.requestPort();
            await serialPort.open({ baudRate: 115200 });
            const encoder = new TextEncoderStream();
            encoder.readable.pipeTo(serialPort.writable);
            serialWriter = encoder.writable.getWriter();
            addLog("Serial: Tx micro:bit connected.");
            checkReady();
        } catch (err) {
            addLog("Serial Error: " + err.message);
        }
    }

    // 2. Load Teachable Machine Model
    async function initAI() {
        let url = document.getElementById("modelUrl").value.trim();
        if (!url) {
            alert("Please paste your Teachable Machine model URL first.");
            return;
        }
        if (!url.endsWith("/")) url += "/";

        try {
            addLog("Loading AI Model...");
            model = await tmImage.load(url + "model.json", url + "metadata.json");
            maxPredictions = model.getTotalClasses();

            webcam = new tmImage.Webcam(320, 240, true);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(predictLoop);

            document.getElementById("webcam-container").innerHTML = "";
            document.getElementById("webcam-container").appendChild(webcam.canvas);

            const meterContainer = document.getElementById("meter-container");
            meterContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                const badge = document.createElement("div");
                badge.className = "live-meter-badge";
                badge.id = "meter-" + i;
                meterContainer.appendChild(badge);
            }
            addLog("AI Camera tracking online.");
            checkReady();
        } catch (err) {
            addLog("Model Error: " + err.message);
        }
    }

    function checkReady() {
        if (model && serialWriter) {
            document.getElementById("btn-start").disabled = false;
        }
    }

    async function predictLoop() {
        webcam.update();
        await evaluatePrediction();
        window.requestAnimationFrame(predictLoop);
    }

    // 3. Real-time Inference & Hit Detection
    async function evaluatePrediction() {
        if (!model) return;
        const predictions = await model.predict(webcam.canvas);

        let topClass = "";
        let topConfidence = 0;

        for (let i = 0; i < maxPredictions; i++) {
            const cName = predictions[i].className;
            const prob = predictions[i].probability;
            const el = document.getElementById("meter-" + i);
            const gesture = GESTURES[cName] || { symbol: "", name: cName, num: "" };

            el.innerHTML = `<span>${gesture.symbol} ${cName} (${gesture.name})</span><span>${(prob * 100).toFixed(0)}%</span>`;

            if (prob > topConfidence) {
                topConfidence = prob;
                topClass = cName;
            }
            if (prob > 0.75) {
                el.classList.add("matched");
            } else {
                el.classList.remove("matched");
            }
        }

        // Validate current target
        if (isGameActive && !isCoolingDown && actionQueue.length > 0) {
            const currentTarget = actionQueue[0];
            if (topClass === currentTarget && topConfidence > 0.75) {
                triggerSuccess(topClass, topConfidence);
            }
        }
    }

    // 4. Game Control & Xbox Style Visual Queue
    function startGame() {
        isGameActive = true;
        isCoolingDown = false;
        score = 0;
        eventLogs = [];
        document.getElementById("score-counter").innerText = "0";
        document.getElementById("btn-start").disabled = true;

        actionQueue = [];
        for (let i = 0; i < QUEUE_LENGTH; i++) {
            actionQueue.push(getRandomGesture());
        }
        renderRibbon();
        startRoundTimer();
        addLog("Game Started! Watch the Hit Zone.");
    }

    function getRandomGesture() {
        return ACTIVE_TARGETS[Math.floor(Math.random() * ACTIVE_TARGETS.length)];
    }

    function renderRibbon() {
        const ribbon = document.getElementById("queue-ribbon");
        ribbon.innerHTML = "";

        actionQueue.forEach((clsKey, index) => {
            const g = GESTURES[clsKey];
            const card = document.createElement("div");
            card.className = "flashcard " + (index === 0 ? "active-target" : "upcoming");
            
            card.innerHTML = `
                <div class="symbol">${g.symbol}</div>
                <div class="gesture-name">${g.name}</div>
                <div class="number-reminder">${g.num}</div>
            `;
            ribbon.appendChild(card);
        });
    }

    function startRoundTimer() {
        clearInterval(gameLoopTimer);
        roundStart = performance.now();
        const bar = document.getElementById("timer-bar");
        const clock = document.getElementById("clock-display");

        gameLoopTimer = setInterval(() => {
            const elapsed = performance.now() - roundStart;
            const remaining = Math.max(0, ROUND_LIMIT_MS - elapsed);
            const pct = (remaining / ROUND_LIMIT_MS) * 100;

            bar.style.width = pct + "%";
            clock.innerText = (remaining / 1000).toFixed(1) + "s";

            if (pct > 50) bar.style.background = "var(--neon-blue)";
            else if (pct > 20) bar.style.background = "var(--neon-yellow)";
            else bar.style.background = "var(--neon-red)";

            if (remaining <= 0) {
                clearInterval(gameLoopTimer);
                triggerTimeout();
            }
        }, 30);
    }

    async function triggerSuccess(matchedClass, prob) {
        isCoolingDown = true;
        clearInterval(gameLoopTimer);

        const duration = Math.round(performance.now() - roundStart);
        score++;
        document.getElementById("score-counter").innerText = score;
        showToast("PERFECT! ⚡", "var(--neon-green)");
        addLog(`HIT: [${matchedClass}] in ${duration}ms (${(prob*100).toFixed(0)}%)`);

        // Record metrics
        eventLogs.push({
            timestamp: new Date().toISOString(),
            target: actionQueue[0],
            matched: matchedClass,
            durationMs: duration,
            status: "HIT"
        });

        // Trigger Tx micro:bit pulse forward (Sends '1\n')
        if (serialWriter) {
            try {
                await serialWriter.write("1\n");
            } catch (err) {
                addLog("Serial Send Err: " + err.message);
            }
        }

        // Shift queue forward
        actionQueue.shift();
        actionQueue.push(getRandomGesture());
        renderRibbon();

        // 800ms cooldown syncs with M1 motor physical pulse
        setTimeout(() => {
            isCoolingDown = false;
            if (isGameActive) startRoundTimer();
        }, 800);
    }

    function triggerTimeout() {
        showToast("MISS! ✖", "var(--neon-red)");
        addLog(`MISS: [${actionQueue[0]}] Timed out`);

        eventLogs.push({
            timestamp: new Date().toISOString(),
            target: actionQueue[0],
            matched: "NONE",
            durationMs: ROUND_LIMIT_MS,
            status: "TIMEOUT"
        });

        actionQueue.shift();
        actionQueue.push(getRandomGesture());
        renderRibbon();
        if (isGameActive) startRoundTimer();
    }

    function showToast(text, color) {
        const toast = document.getElementById("feedback-toast");
        toast.innerText = text;
        toast.style.color = color;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 500);
    }

    function addLog(msg) {
        const b = document.getElementById("log-box");
        b.innerHTML += `<div>> ${msg}</div>`;
        b.scrollTop = b.scrollHeight;
    }

    // 5. Cloud Logging to Google Drive
    async function uploadDataToDrive() {
        if (!GAS_ENDPOINT || GAS_ENDPOINT.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
            alert("Please paste your Google Apps Script endpoint URL.");
            return;
        }

        const payload = {
            folderId: DRIVE_FOLDER_ID,
            groupId: document.getElementById("groupId").value || "Unassigned",
            studentId: document.getElementById("studentId").value || "Anonymous",
            condition: document.getElementById("conditionType").value,
            score: score,
            comments: document.getElementById("studentComments").value,
            logs: eventLogs
        };

        addLog("Syncing logs to Google Drive...");
        try {
            await fetch(GAS_ENDPOINT, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            alert("Logs saved successfully to Google Drive!");
            addLog("Cloud sync complete.");
        } catch (err) {
            addLog("Sync failed: " + err.message);
            alert("Upload failed. Check network connection.");
        }
    }
</script>
</body>
</html>
