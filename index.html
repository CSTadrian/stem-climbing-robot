<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Robot Gesture Arena - MediaPipe Edition</title>
    <!-- 引入 MediaPipe Hands 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-blue: #00f0ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --bg-dark: #0a0b16;
            --card-bg: rgba(22, 26, 51, 0.9);
            --border-dim: #262c54;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% 20%, #171b38 0%, var(--bg-dark) 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        .arena-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 學生基本資訊膠囊條 */
        .meta-strip {
            display: grid;
            grid-template-columns: 140px 140px 1.5fr auto;
            gap: 10px;
            background: rgba(14, 17, 36, 0.8);
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-dim);
            align-items: center;
        }
        .meta-strip input, .meta-strip select {
            background: #060812;
            border: 1px solid #333c6d;
            color: #fff;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        /* ================= 核心：1-2-3 步驟結構看板 ================= */
        .stepper-board {
            display: grid;
            grid-template-columns: 1fr 1.6fr 1fr;
            gap: 14px;
        }
        .step-card {
            background: var(--card-bg);
            border: 2px solid var(--border-dim);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: all 0.3s ease;
        }
        .step-card.done {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }
        .step-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .step-title {
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .step-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            background: #111428;
            color: #8892b0;
            border: 1px solid #333d6b;
            font-weight: bold;
        }
        .step-card.done .step-tag {
            background: rgba(0, 255, 102, 0.15);
            color: var(--neon-green);
            border-color: var(--neon-green);
        }
        .step-btn {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: #fff;
            border: 1px solid #475569;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .step-btn:hover { filter: brightness(1.15); }
        .step-btn.ready-btn {
            background: linear-gradient(135deg, #059669, #10b981);
            border-color: var(--neon-green);
        }

        /* 骨骼採樣按鈕組 */
        .sample-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }
        .sample-btn {
            background: #0e1124;
            border: 1px solid #333d6b;
            color: #fff;
            padding: 6px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: all 0.2s;
        }
        .sample-btn:active, .sample-btn.recording {
            background: var(--neon-pink);
            border-color: #fff;
            transform: scale(0.95);
        }
        .sample-count {
            font-size: 9px;
            color: var(--neon-yellow);
        }

        /* 步驟 3 大按鈕 */
        .btn-launch {
            background: #1a2035;
            color: #64748b;
            border: 2px dashed #334155;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 900;
            cursor: not-allowed;
            letter-spacing: 1px;
            width: 100%;
            height: 100%;
            min-height: 48px;
        }
        .btn-launch.unlocked {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-green));
            color: #032117;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            animation: pulse-launch 1.4s infinite alternate;
        }
        @keyframes pulse-launch {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
            100% { transform: scale(1.02); box-shadow: 0 0 25px rgba(0, 255, 102, 0.8); }
        }

        /* ================= 遊戲擂台與軌道 ================= */
        .stage-layout {
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 16px;
        }
        .arena-box {
            background: var(--card-bg);
            border: 2px solid var(--border-dim);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .combo-badge {
            font-size: 26px;
            color: var(--neon-yellow);
            font-weight: 900;
            text-shadow: 0 0 12px rgba(255, 230, 0, 0.7);
            transition: transform 0.1s;
        }
        .combo-badge.pop { transform: scale(1.3) rotate(-3deg); }
        .score-pill {
            background: linear-gradient(90deg, #ff007f, #7928ca);
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 900;
        }

        /* 動作流動軌道 */
        .ribbon-track-wrapper {
            background: #080914;
            border: 2px solid #202747;
            border-radius: 14px;
            padding: 14px;
            position: relative;
            overflow: hidden;
        }
        .ribbon-track {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .action-card {
            background: #141730;
            border: 2px solid #2c355e;
            border-radius: 12px;
            min-width: 100px;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .action-card .symbol { font-size: 44px; line-height: 1; margin-bottom: 4px; }
        .action-card .c-name { font-size: 15px; font-weight: 800; }
        .action-card .sub-num {
            font-size: 10px;
            font-weight: bold;
            color: #8892b0;
            background: rgba(255,255,255,0.08);
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
        }
        .action-card.active-target {
            min-width: 130px;
            height: 160px;
            background: linear-gradient(180deg, #2c164a 0%, #151a3c 100%);
            border: 3px solid var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            transform: scale(1.05);
            z-index: 2;
        }
        .action-card.active-target .symbol { font-size: 58px; }
        .action-card.active-target::before {
            content: "⚡ HIT NOW";
            position: absolute;
            top: -12px;
            background: var(--neon-pink);
            color: #fff;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .action-card.upcoming { opacity: 0.6; transform: scale(0.92); }

        .timer-bg {
            height: 7px;
            background: #181d38;
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }
        .timer-fill {
            height: 100%;
            width: 100%;
            background: var(--neon-blue);
            transition: width 0.05s linear;
        }

        /* 視訊骨骼畫布 */
        .arena-footer {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 14px;
            align-items: center;
        }
        .canvas-wrapper {
            width: 220px;
            height: 150px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #2e366b;
            position: relative;
        }
        #webcam-video { display: none; }
        #output-canvas {
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* 鏡像翻轉 */
        }
        .meters-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .meter-row {
            background: #0e1124;
            border: 1px solid #232a50;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
        .meter-row.matched {
            background: rgba(0, 255, 102, 0.15);
            border-color: var(--neon-green);
            color: var(--neon-green);
            font-weight: bold;
        }

        /* 攀爬高度塔 */
        .tower-card {
            background: var(--card-bg);
            border: 2px solid var(--border-dim);
            border-radius: 16px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .rope-shaft {
            flex-grow: 1;
            width: 6px;
            background: #2b335c;
            border-radius: 3px;
            margin: 10px 0;
            position: relative;
            min-height: 250px;
        }
        .robot-indicator {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 0%;
            font-size: 34px;
            transition: bottom 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 0 6px #00f0ff);
        }

        #splash-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        #splash-text.show { transform: translate(-50%, -50%) scale(1.15); }
    </style>
</head>
<body>

<div class="arena-container">
    <div class="meta-strip">
        <input type="text" id="groupId" placeholder="組別 (例: Group-01)">
        <input type="text" id="studentId" placeholder="學號 (例: S01)">
        <select id="conditionType">
            <option value="MediaPipe_Geometry">骨骼幾何模型組 (MediaPipe)</option>
            <option value="Baseline_Raw">傳統特徵對照組</option>
        </select>
        <button onclick="uploadDataToDrive()" style="background:#1e293b; color:#94a3b8; border:1px solid #334155; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:12px;">
            📤 提交成績到 Drive
        </button>
    </div>

    <!-- 1-2-3 步驟看板 -->
    <div class="stepper-board">
        <!-- 步驟 1: 硬件串口連接 -->
        <div class="step-card" id="card-step1">
            <div>
                <div class="step-header">
                    <span class="step-title">🔌 步驟 1：連接硬件</span>
                    <span class="step-tag" id="tag-step1">未連接 ⚪</span>
                </div>
                <div style="font-size: 11px; color: #8892b0; margin-bottom: 10px;">
                    將發射端 micro:bit 直插電腦 USB
                </div>
            </div>
            <button class="step-btn" id="btn-step1" onclick="connectSerial()">
                連接 Tx micro:bit
            </button>
        </div>

        <!-- 步驟 2: 現場手勢骨骼錄製與極速訓練 -->
        <div class="step-card" id="card-step2">
            <div>
                <div class="step-header">
                    <span class="step-title">✋ 步驟 2：手勢採樣</span>
                    <span class="step-tag" id="tag-step2">未啟動 ⚪</span>
                </div>
                <!-- 5 類手勢採樣按鈕 -->
                <div class="sample-grid">
                    <button class="sample-btn" id="btn-sample-Class 1" onmousedown="startSampling('Class 1')" onmouseup="stopSampling()">
                        <span>✊ 石頭</span>
                        <span class="sample-count" id="cnt-Class 1">0 幀</span>
                    </button>
                    <button class="sample-btn" id="btn-sample-Class 2" onmousedown="startSampling('Class 2')" onmouseup="stopSampling()">
                        <span>✌️ 剪刀</span>
                        <span class="sample-count" id="cnt-Class 2">0 幀</span>
                    </button>
                    <button class="sample-btn" id="btn-sample-Class 3" onmousedown="startSampling('Class 3')" onmouseup="stopSampling()">
                        <span>🖐️ 布</span>
                        <span class="sample-count" id="cnt-Class 3">0 幀</span>
                    </button>
                    <button class="sample-btn" id="btn-sample-Class 4" onmousedown="startSampling('Class 4')" onmouseup="stopSampling()">
                        <span>👍 讚好</span>
                        <span class="sample-count" id="cnt-Class 4">0 幀</span>
                    </button>
                    <button class="sample-btn" id="btn-sample-Class 5" onmousedown="startSampling('Class 5')" onmouseup="stopSampling()">
                        <span>🫱 待機</span>
                        <span class="sample-count" id="cnt-Class 5">0 幀</span>
                    </button>
                    <button class="sample-btn" style="background:#2a1b40; border-color:#ff007f;" onclick="clearDataset()">
                        <span>🗑️ 重置</span>
                        <span style="font-size:9px; color:#8892b0;">清空樣本</span>
                    </button>
                </div>
            </div>
            <button class="step-btn" id="btn-step2" onclick="initMediaPipe()">
                啟動鏡頭開始採樣
            </button>
        </div>

        <!-- 步驟 3: 啟動對戰競技 -->
        <div class="step-card" id="card-step3">
            <div>
                <div class="step-header">
                    <span class="step-title">🚀 步驟 3：開始競技</span>
                    <span class="step-tag" id="tag-step3">待解鎖 🔒</span>
                </div>
                <div style="font-size: 11px; color: #8892b0; margin-bottom: 10px;" id="desc-step3">
                    需完成步驟 1 並每款手勢錄製 ≥10 幀
                </div>
            </div>
            <button class="btn-launch" id="btn-launch" onclick="startGame()" disabled>
                等待準備...
            </button>
        </div>
    </div>

    <!-- 主遊戲擂台 -->
    <div class="stage-layout">
        <div class="arena-box">
            <div class="hud-bar">
                <div class="combo-badge" id="combo-display">0x COMBO</div>
                <div class="score-pill">攀爬得分：<span id="score-counter">0</span></div>
            </div>

            <!-- 動作預告流動軌道 -->
            <div class="ribbon-track-wrapper">
                <div class="ribbon-track" id="queue-ribbon"></div>
                <div class="timer-bg">
                    <div class="timer-fill" id="timer-bar"></div>
                </div>
                <div id="splash-text">PERFECT!</div>
            </div>

            <!-- 視訊骨骼預覽與信心度 -->
            <div class="arena-footer">
                <div class="canvas-wrapper">
                    <video id="webcam-video" playsinline></video>
                    <canvas id="output-canvas"></canvas>
                </div>
                <div class="meters-grid" id="meters-container"></div>
            </div>
        </div>

        <!-- 右側攀爬高度塔 -->
        <div class="tower-card">
            <div style="font-size: 26px;">🏆</div>
            <div style="font-size: 10px; color: #8892b0; font-weight: bold;">FINISH</div>
            <div class="rope-shaft" id="rope-shaft">
                <div class="robot-indicator" id="robot-indicator">🤖</div>
            </div>
            <div style="font-size: 10px; color: #8892b0; font-weight: bold;">START</div>
            <div style="font-size: 20px;">🚩</div>
        </div>
    </div>
</div>

<script>
    const GESTURES = {
        "Class 1": { name: "石頭", symbol: "✊", num: "No. 1" },
        "Class 2": { name: "剪刀", symbol: "✌️", num: "No. 2" },
        "Class 3": { name: "布",   symbol: "🖐️", num: "No. 3" },
        "Class 4": { name: "讚好", symbol: "👍", num: "No. 4" },
        "Class 5": { name: "待機", symbol: "🫱", num: "No. 5" }
    };
    const ACTIVE_TARGETS = ["Class 1", "Class 2", "Class 3", "Class 4"];
    const DRIVE_FOLDER_ID = "18VTaAPt86z7u4BCevGm96ZDF6uRdoODu";
    const GAS_ENDPOINT = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    let step1Ready = false;
    let step2Ready = false;

    // 音效模組
    let audioCtx = null;
    function playSfx(type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === "hit") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(587, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === "combo") {
                osc.type = "triangle";
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(659, now + 0.08);
                osc.frequency.setValueAtTime(784, now + 0.16);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc.start(now); osc.stop(now + 0.35);
            } else if (type === "miss") {
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.linearRampToValueAtTime(90, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            }
        } catch(e) {}
    }

    let serialPort, serialWriter;

    // ================= 步驟 1：WebSerial 連接 =================
    async function connectSerial() {
        try {
            serialPort = await navigator.serial.requestPort();
            await serialPort.open({ baudRate: 115200 });
            const enc = new TextEncoderStream();
            enc.readable.pipeTo(serialPort.writable);
            serialWriter = enc.writable.getWriter();

            step1Ready = true;
            document.getElementById("card-step1").classList.add("done");
            document.getElementById("tag-step1").innerText = "已連線 🟢";
            document.getElementById("btn-step1").innerText = "✔ 連線成功";
            document.getElementById("btn-step1").classList.add("ready-btn");
            checkCanUnlockStep3();
        } catch (e) {
            alert("Serial 連接取消或失敗: " + e.message);
        }
    }

    // ================= 步驟 2：MediaPipe Hands & 骨骼特徵數據集 =================
    let hands, camera;
    let videoElement, canvasElement, canvasCtx;
    let currentLandmarks = null; // 當前偵測到的 21 點
    let dataset = [];            // 學生採樣的骨骼特徵庫 { label: "Class 1", vector: [...] }
    let isSampling = false;
    let samplingTarget = null;
    let sampleInterval = null;

    async function initMediaPipe() {
        const btn = document.getElementById("btn-step2");
        btn.innerText = "載入 MediaPipe 引擎中...";
        btn.disabled = true;

        videoElement = document.getElementById("webcam-video");
        canvasElement = document.getElementById("output-canvas");
        canvasCtx = canvasElement.getContext("2d");

        // 初始化 MediaPipe Hands
        hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onHandResults);

        // 啟動鏡頭串流
        camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 320,
            height: 240
        });
        await camera.start();

        // 建立信心度計量條 UI
        const mBox = document.getElementById("meters-container");
        mBox.innerHTML = "";
        Object.keys(GESTURES).forEach((key) => {
            const row = document.createElement("div");
            row.className = "meter-row";
            row.id = "meter-row-" + key.replace(" ", "-");
            mBox.appendChild(row);
        });

        document.getElementById("tag-step2").innerText = "鏡頭就緒 🟡";
        btn.innerText = "請在上方按住按鈕錄製手勢";
        btn.classList.add("ready-btn");
    }

    // 處理手勢識別結果並繪製骨骼
    function onHandResults(results) {
        canvasElement.width = videoElement.videoWidth || 320;
        canvasElement.height = videoElement.videoHeight || 240;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            currentLandmarks = results.multiHandLandmarks[0];
            drawSkeleton(currentLandmarks);

            // 如果正在訓練中且有數據，進行即時幾何分類預測
            if (dataset.length > 0) {
                classifyCurrentPose();
            }
        } else {
            currentLandmarks = null;
        }
        canvasCtx.restore();
    }

    // 繪製科幻螢光骨骼線條
    function drawSkeleton(landmarks) {
        const CONNECTIONS = [
            [0,1],[1,2],[2,3],[3,4],
            [0,5],[5,6],[6,7],[7,8],
            [5,9],[9,10],[10,11],[11,12],
            [9,13],[13,14],[14,15],[15,16],
            [13,17],[17,18],[18,19],[19,20],[0,17]
        ];

        canvasCtx.strokeStyle = "#00f0ff";
        canvasCtx.lineWidth = 3;
        CONNECTIONS.forEach(([i, j]) => {
            canvasCtx.beginPath();
            canvasCtx.moveTo(landmarks[i].x * canvasElement.width, landmarks[i].y * canvasElement.height);
            canvasCtx.lineTo(landmarks[j].x * canvasElement.width, landmarks[j].y * canvasElement.height);
            canvasCtx.stroke();
        });

        // 關節節點
        canvasCtx.fillStyle = "#ff007f";
        landmarks.forEach(pt => {
            canvasCtx.beginPath();
            canvasCtx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, 4, 0, 2 * Math.PI);
            canvasCtx.fill();
        });
    }

    // 幾何特徵歸一化（將 21 個點以手腕為原點平移並按手掌尺寸縮放）
    function extractNormalizedFeatures(landmarks) {
        const base = landmarks[0]; // 手腕座標
        // 以手腕到中指根節點 (Landmark 9) 的歐氏距離作為手掌基準尺寸
        const scale = Math.hypot(landmarks[9].x - base.x, landmarks[9].y - base.y) || 1.0;
        
        const featureVector = [];
        for (let i = 0; i < 21; i++) {
            featureVector.push((landmarks[i].x - base.x) / scale);
            featureVector.push((landmarks[i].y - base.y) / scale);
            featureVector.push((landmarks[i].z - base.z) / scale);
        }
        return featureVector; // 63 維幾何特徵向量
    }

    // 學生長按採樣機制
    function startSampling(label) {
        if (!currentLandmarks) {
            alert("鏡頭前未偵測到手掌，請先將手伸入畫面！");
            return;
        }
        isSampling = true;
        samplingTarget = label;
        document.getElementById("btn-sample-" + label).classList.add("recording");

        sampleInterval = setInterval(() => {
            if (isSampling && currentLandmarks) {
                const vector = extractNormalizedFeatures(currentLandmarks);
                dataset.push({ label: samplingTarget, vector: vector });
                updateSampleCountUI(samplingTarget);
                checkModelReadiness();
            }
        }, 80); // 每 80ms 取樣一幀
    }

    function stopSampling() {
        isSampling = false;
        clearInterval(sampleInterval);
        if (samplingTarget) {
            document.getElementById("btn-sample-" + samplingTarget).classList.remove("recording");
            samplingTarget = null;
        }
    }

    function updateSampleCountUI(label) {
        const count = dataset.filter(d => d.label === label).length;
        document.getElementById("cnt-" + label).innerText = count + " 幀";
    }

    function clearDataset() {
        dataset = [];
        Object.keys(GESTURES).forEach(key => updateSampleCountUI(key));
        step2Ready = false;
        document.getElementById("card-step2").classList.remove("done");
        document.getElementById("tag-step2").innerText = "已重置 ⚪";
        document.getElementById("btn-step2").innerText = "請重新錄製 5 款手勢";
        checkCanUnlockStep3();
    }

    function checkModelReadiness() {
        // 檢查 5 款手勢每款是否皆錄了 ≥ 8 幀
        const counts = Object.keys(GESTURES).map(k => dataset.filter(d => d.label === k).length);
        const allReady = counts.every(c => c >= 8);

        if (allReady && !step2Ready) {
            step2Ready = true;
            document.getElementById("card-step2").classList.add("done");
            document.getElementById("tag-step2").innerText = "訓練完成 🟢";
            document.getElementById("btn-step2").innerText = "✔ 5 款手勢模型就緒";
            checkCanUnlockStep3();
        }
    }

    // 核心輕量分類器（KNN：最近鄰歐氏距離算法）
    function classifyCurrentPose() {
        const currentVec = extractNormalizedFeatures(currentLandmarks);

        // 計算當前特徵與資料庫所有樣本的歐氏距離
        const distances = dataset.map(sample => {
            let distSq = 0;
            for (let i = 0; i < currentVec.length; i++) {
                const diff = currentVec[i] - sample.vector[i];
                distSq += diff * diff;
            }
            return { label: sample.label, dist: Math.sqrt(distSq) };
        });

        // 排序取前 K 個最近鄰 (K=5)
        distances.sort((a, b) => a.dist - b.dist);
        const k = Math.min(5, distances.length);
        const topK = distances.slice(0, k);

        // 統計各類別得票與信心度
        const scores = {};
        Object.keys(GESTURES).forEach(k => scores[k] = 0);
        topK.forEach(item => scores[item.label]++);

        let topCls = "Class 5";
        let maxVotes = 0;
        Object.keys(scores).forEach(cls => {
            const prob = scores[cls] / k;
            const row = document.getElementById("meter-row-" + cls.replace(" ", "-"));
            const g = GESTURES[cls];
            row.innerHTML = `<span>${g.symbol} ${g.name}</span><span>${(prob * 100).toFixed(0)}%</span>`;

            if (prob > 0.6) row.classList.add("matched");
            else row.classList.remove("matched");

            if (scores[cls] > maxVotes) {
                maxVotes = scores[cls];
                topCls = cls;
            }
        });

        // 觸發遊戲比對
        if (isRunning && !isLocked && actionQueue.length > 0) {
            const currentTarget = actionQueue[0];
            const topProb = maxVotes / k;
            if (topCls === currentTarget && topProb >= 0.6) {
                handleSuccess(topCls, topProb);
            }
        }
    }

    // ================= 檢查並解鎖步驟 3 =================
    function checkCanUnlockStep3() {
        if (step1Ready && step2Ready) {
            document.getElementById("card-step3").classList.add("done");
            document.getElementById("tag-step3").innerText = "準備就緒 ✨";
            document.getElementById("desc-step3").innerText = "一切就緒！點擊下方按鈕出發";

            const launchBtn = document.getElementById("btn-launch");
            launchBtn.disabled = false;
            launchBtn.innerText = "🚀 開始攀爬競技！";
            launchBtn.classList.add("unlocked");
        }
    }

    // ================= 遊戲核心循環 =================
    let actionQueue = [];
    const QUEUE_LENGTH = 5;
    let isRunning = false;
    let isLocked = false;
    let score = 0;
    let combo = 0;
    let roundStart = 0;
    const TIME_LIMIT_MS = 3000;
    let timerLoop = null;
    let eventLogs = [];

    function startGame() {
        isRunning = true;
        isLocked = false;
        score = 0;
        combo = 0;
        eventLogs = [];
        updateHUD();

        const launchBtn = document.getElementById("btn-launch");
        launchBtn.innerText = "🎮 競技進行中...";
        launchBtn.classList.remove("unlocked");
        launchBtn.disabled = true;

        actionQueue = [];
        for (let i = 0; i < QUEUE_LENGTH; i++) {
            actionQueue.push(getRandomGesture());
        }
        renderQueue();
        startTimer();
    }

    function getRandomGesture() {
        return ACTIVE_TARGETS[Math.floor(Math.random() * ACTIVE_TARGETS.length)];
    }

    function renderQueue() {
        const ribbon = document.getElementById("queue-ribbon");
        ribbon.innerHTML = "";

        actionQueue.forEach((clsKey, index) => {
            const g = GESTURES[clsKey];
            const card = document.createElement("div");
            card.className = "action-card " + (index === 0 ? "active-target" : "upcoming");
            card.innerHTML = `
                <div class="symbol">${g.symbol}</div>
                <div class="c-name">${g.name}</div>
                <div class="sub-num">${g.num}</div>
            `;
            ribbon.appendChild(card);
        });
    }

    function startTimer() {
        clearInterval(timerLoop);
        roundStart = performance.now();
        const bar = document.getElementById("timer-bar");

        timerLoop = setInterval(() => {
            const elapsed = performance.now() - roundStart;
            const remaining = Math.max(0, TIME_LIMIT_MS - elapsed);
            const pct = (remaining / TIME_LIMIT_MS) * 100;

            bar.style.width = pct + "%";
            if (pct > 40) bar.style.background = "var(--neon-blue)";
            else bar.style.background = "var(--neon-pink)";

            if (remaining <= 0) {
                clearInterval(timerLoop);
                handleTimeout();
            }
        }, 30);
    }

    async function handleSuccess(matchedCls, prob) {
        isLocked = true;
        clearInterval(timerLoop);

        const duration = Math.round(performance.now() - roundStart);
        score++;
        combo++;

        if (combo >= 3) {
            playSfx("combo");
            popSplash("🔥 " + combo + "x COMBO!", "var(--neon-yellow)");
            if (typeof confetti === "function") {
                confetti({ particleCount: 25, spread: 60, origin: { y: 0.6 } });
            }
        } else {
            playSfx("hit");
            popSplash("PERFECT! ⚡", "var(--neon-green)");
        }

        updateHUD();

        eventLogs.push({
            timestamp: new Date().toISOString(),
            target: actionQueue[0],
            matched: matchedCls,
            durationMs: duration,
            status: "HIT"
        });

        // 經 WebSerial 送 1\n 讓 Tx 驅動爬繩機械人推進
        if (serialWriter) {
            try { await serialWriter.write("1\n"); } catch(e) {}
        }

        actionQueue.shift();
        actionQueue.push(getRandomGesture());
        renderQueue();

        setTimeout(() => {
            isLocked = false;
            if (isRunning) startTimer();
        }, 800);
    }

    function handleTimeout() {
        combo = 0;
        playSfx("miss");
        popSplash("MISS! ✖", "var(--neon-pink)");
        updateHUD();

        eventLogs.push({
            timestamp: new Date().toISOString(),
            target: actionQueue[0],
            matched: "NONE",
            durationMs: TIME_LIMIT_MS,
            status: "TIMEOUT"
        });

        actionQueue.shift();
        actionQueue.push(getRandomGesture());
        renderQueue();
        if (isRunning) startTimer();
    }

    function popSplash(text, color) {
        const el = document.getElementById("splash-text");
        el.innerText = text;
        el.style.color = color;
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 450);
    }

    function updateHUD() {
        document.getElementById("score-counter").innerText = score;
        const comboEl = document.getElementById("combo-display");
        comboEl.innerText = combo + "x COMBO";
        comboEl.classList.add("pop");
        setTimeout(() => comboEl.classList.remove("pop"), 120);

        const climbPct = Math.min(92, (score / 15) * 92);
        document.getElementById("robot-indicator").style.bottom = climbPct + "%";
    }

    // 上傳成績至 Google Drive / Sheets
    async function uploadDataToDrive() {
        if (!GAS_ENDPOINT || GAS_ENDPOINT.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
            alert("請先填寫 Google Apps Script 網址！");
            return;
        }

        const payload = {
            folderId: DRIVE_FOLDER_ID,
            groupId: document.getElementById("groupId").value || "G_Unknown",
            studentId: document.getElementById("studentId").value || "S_Unknown",
            condition: document.getElementById("conditionType").value,
            score: score,
            totalSamples: dataset.length,
            logs: eventLogs
        };

        try {
            await fetch(GAS_ENDPOINT, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            alert("比賽日誌與採樣特徵已成功儲存！");
        } catch (err) {
            alert("上傳失敗: " + err.message);
        }
    }
</script>
